[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prh-toolkit"
version = "0.1.0"
description = "Controls, alignment metrics, null models and a shared results format for testing the Platonic Representation Hypothesis."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
analysis = ["numpy<3", "torch", "matplotlib<4", "pot"]
dev = ["pytest<9"]

[project.scripts]
prh = "prh.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tools"]
testpaths = ["tests"]
